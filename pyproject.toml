[project]
name = "omnimanip"
version = "0.1.0"
description = "OmniManip (arXiv 2501.03841) baseline on the CoRAL UR5e"
requires-python = ">=3.12"
dependencies = [
    "kmeans-pytorch>=0.3",
    "litellm",
    "msgpack",
    "msgpack-numpy",
    "numba>=0.68.1",
    "numpy",
    "open3d>=0.20.0; sys_platform == 'darwin'",
    "open3d==0.19.*; sys_platform == 'linux'",  # CoRAL is Ubuntu 20.04 (glibc 2.31): 0.20 needs 2.35
    "opencv-python-headless",
    "parse>=1.22.4",
    "pillow",
    "pyrender>=0.1.45",
    "python-dotenv",
    "pyyaml>=6.0.3",
    "pyzmq",
    "rosbags",
    "scikit-learn>=1.9.1",
    "scipy",
    "torch>=2.15.0",
    "trimesh",
]

[dependency-groups]
dev = ["pyright", "ruff"]

[tool.uv]
package = false
# pyrender pins PyOpenGL==3.1.0, whose glGenTextures breaks on Python 3.12+ (textured meshes fail)
override-dependencies = ["pyopengl>=3.1.7"]

[tool.ruff]
extend-exclude = ["third_party"]

[tool.pyright]
exclude = ["third_party", ".venv", "rekep/sam_server.py"]  # sam_server.py runs in its SAM container
venvPath = "."
venv = ".venv"
